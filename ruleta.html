<!DOCTYPE html>
<html lang="es">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>🎰 Gran Rifa</title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: #f4f6f8;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .contenedor {

      width: 90%;

      max-width: 1100px;

      text-align: center;

    }


    h1 {

      font-size: 60px;

      margin: 0 0 10px;

      color: #222;

    }


    .subtitulo {

      font-size: 24px;

      color: #666;

      margin-bottom: 40px;

    }


    .ruleta {

      background: white;

      border-radius: 30px;

      padding: 60px 40px;

      box-shadow:
        0 15px 40px rgba(0,0,0,0.15);

    }


    #nombre {

      font-size: 55px;

      font-weight: bold;

      min-height: 90px;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #222;

      transition: transform 0.15s;

    }


    #estado {

      margin-top: 25px;

      font-size: 25px;

      color: #666;

    }


    button {

      margin-top: 40px;

      padding: 20px 60px;

      font-size: 28px;

      font-weight: bold;

      border: none;

      border-radius: 50px;

      cursor: pointer;

      background: #222;

      color: white;

    }


    button:hover {

      transform: scale(1.05);

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;

    }


    .contador {

      margin-top: 30px;

      font-size: 22px;

      color: #666;

    }


    #ganador {

      display: none;

      margin-top: 40px;

      padding-top: 30px;

      border-top: 2px solid #eee;

    }


    #ganador h2 {

      font-size: 38px;

      margin: 0 0 15px;

    }


    #ganadorNombre {

      font-size: 55px;

      font-weight: bold;

    }


    .celebracion {

      animation: ganador 0.8s ease;

    }


    @keyframes ganador {

      0% {

        transform: scale(0.5);

        opacity: 0;

      }

      70% {

        transform: scale(1.15);

      }

      100% {

        transform: scale(1);

        opacity: 1;

      }

    }


    .girando {

      animation: pulso 0.15s infinite alternate;

    }


    @keyframes pulso {

      from {

        transform: scale(1);

      }

      to {

        transform: scale(1.08);

      }

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <h1>
      🎉 GRAN RIFA 🎉
    </h1>


    <div class="subtitulo">

      ¡Mucha suerte a todos! 🍀

    </div>


    <div class="ruleta">


      <div id="nombre">

        Cargando participantes...

      </div>


      <div id="estado">

        Preparando la ruleta...

      </div>


      <button
        id="botonGirar"
        onclick="girar()"
        disabled>

        🎰 GIRAR

      </button>


      <div class="contador">

        Participantes disponibles:
        <strong id="contador">0</strong>

      </div>


      <div id="ganador">

        <h2>
          🏆 ¡TENEMOS GANADOR! 🏆
        </h2>


        <div id="ganadorNombre"></div>

      </div>


    </div>


  </div>



<script>


  let participantes = [];

  let girando = false;



  // ==========================================
  // CARGAR PARTICIPANTES
  // ==========================================

  function cargarParticipantes() {

    google.script.run

      .withSuccessHandler(
        recibirParticipantes
      )

      .withFailureHandler(
        mostrarError
      )

      .obtenerParticipantesRuleta();

  }



  function recibirParticipantes(
    datos
  ) {

    participantes =
      datos || [];

    actualizarInterfaz();

  }



  // ==========================================
  // ACTUALIZAR INTERFAZ
  // ==========================================

  function actualizarInterfaz() {

    document.getElementById(
      "contador"
    ).textContent =
      participantes.length;


    if (
      participantes.length === 0
    ) {

      document.getElementById(
        "nombre"
      ).textContent =
        "No hay participantes";


      document.getElementById(
        "estado"
      ).textContent =
        "No hay participantes disponibles.";


      document.getElementById(
        "botonGirar"
      ).disabled = true;


      return;

    }


    document.getElementById(
      "nombre"
    ).textContent =
      "¿Quién será el ganador?";


    document.getElementById(
      "estado"
    ).textContent =
      "Presiona GIRAR para comenzar";


    document.getElementById(
      "botonGirar"
    ).disabled = false;

  }



  // ==========================================
  // GIRAR
  // ==========================================

  function girar() {

    if (
      girando ||
      participantes.length === 0
    ) {

      return;

    }


    girando = true;


    const boton =
      document.getElementById(
        "botonGirar"
      );


    boton.disabled = true;


    document.getElementById(
      "ganador"
    ).style.display =
      "none";


    document.getElementById(
      "estado"
    ).textContent =
      "🎰 ¡SORTEANDO!";


    const nombre =
      document.getElementById(
        "nombre"
      );


    nombre.classList.add(
      "girando"
    );


    // --------------------------------------
    // Pedimos al servidor el ganador REAL
    // --------------------------------------

    google.script.run

      .withSuccessHandler(
        iniciarAnimacion
      )

      .withFailureHandler(
        mostrarError
      )

      .sortearGanador();

  }



  // ==========================================
  // ANIMACIÓN
  // ==========================================

  function iniciarAnimacion(
    resultado
  ) {

    if (
      !resultado ||
      resultado.estado !== "ganador"
    ) {

      girando = false;

      document.getElementById(
        "botonGirar"
      ).disabled = false;


      document.getElementById(
        "estado"
      ).textContent =
        resultado.mensaje ||
        "No se pudo realizar el sorteo.";


      return;

    }


    const nombre =
      document.getElementById(
        "nombre"
      );


    let vueltas = 0;

    const maxVueltas = 35;


    const intervalo =
      setInterval(
        function() {


          const indice =
            Math.floor(
              Math.random() *
              participantes.length
            );


          const persona =
            participantes[indice];


          nombre.textContent =
            persona.nombre +
            " " +
            persona.apellidos;


          vueltas++;


          if (
            vueltas >= maxVueltas
          ) {

            clearInterval(
              intervalo
            );


            mostrarGanador(
              resultado
            );

          }


        },

        80

      );

  }



  // ==========================================
  // MOSTRAR GANADOR
  // ==========================================

  function mostrarGanador(
    ganador
  ) {

    const nombre =
      document.getElementById(
        "nombre"
      );


    nombre.classList.remove(
      "girando"
    );


    nombre.textContent =
      ganador.nombre +
      " " +
      ganador.apellidos;


    nombre.classList.add(
      "celebracion"
    );


    document.getElementById(
      "estado"
    ).textContent =
      "🎉 ¡Felicidades!";


    document.getElementById(
      "ganadorNombre"
    ).textContent =
      ganador.nombre +
      " " +
      ganador.apellidos;


    document.getElementById(
      "ganador"
    ).style.display =
      "block";


    // --------------------------------------
    // Eliminarlo de la lista local
    // --------------------------------------

    participantes =
      participantes.filter(
        function(persona) {

          return (
            persona.fila !==
            ganador.fila
          );

        }
      );


    document.getElementById(
      "contador"
    ).textContent =
      participantes.length;


    girando = false;


    document.getElementById(
      "botonGirar"
    ).disabled =
      participantes.length === 0;

  }



  // ==========================================
  // ERROR
  // ==========================================

  function mostrarError(
    error
  ) {

    console.error(error);


    document.getElementById(
      "nombre"
    ).textContent =
      "❌ Error";


    document.getElementById(
      "estado"
    ).textContent =
      "No se pudo cargar la información.";


    document.getElementById(
      "botonGirar"
    ).disabled = true;

  }



  // ==========================================
  // INICIO
  // ==========================================

  cargarParticipantes();


</script>


</body>

</html>
